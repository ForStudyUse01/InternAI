services:
  - type: web
    name: internai-api
    env: node
    plan: free
    buildCommand: node ../deployment-guard/run.mjs --target=backend && npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_TARGET
        value: render
      - key: AI_PREFER_LOCAL_HEURISTICS
        value: true
      - key: AI_REQUESTS_PER_MINUTE
        value: 10
      - key: ENABLE_CHAT
        value: true
      - key: ENABLE_INTERVIEW_ROOMS
        value: true
      - key: REDIS_ENABLED
        value: true
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
